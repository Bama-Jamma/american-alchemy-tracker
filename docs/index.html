<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Alchemy — Reference Index</title>
<meta name="description" content="Every book and document referenced on the American Alchemy podcast, indexed by episode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="eyebrow">American Alchemy — Reference Index</div>
    <h1>The Alchemist's Bookshelf</h1>
    <p class="tagline">Every book and document mentioned on the show, sorted by episode.</p>
  </header>

  <main>
    <div class="sticky-controls">
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" data-tab="episodes" role="tab" aria-selected="true">By Episode</button>
        <button class="tab-btn" data-tab="most-referenced" role="tab" aria-selected="false">Most Referenced</button>
        <button class="tab-btn" data-tab="books" role="tab" aria-selected="false">Books</button>
        <button class="tab-btn" data-tab="documents" role="tab" aria-selected="false">Documents</button>
      </div>
      <div class="filter-bar">
        <input type="search" id="search-input" placeholder="Search titles, authors, sources, episodes…" autocomplete="off">
        <div class="filter-selects">
          <select id="filter-type" aria-label="Filter by type">
            <option value="all">All types</option>
            <option value="book">Books</option>
            <option value="document">Documents</option>
          </select>
          <select id="filter-subcategory" aria-label="Filter by document subcategory">
            <option value="all">All subcategories</option>
          </select>
          <select id="filter-episode" aria-label="Filter by episode">
            <option value="all">All episodes</option>
          </select>
        </div>
      </div>
    </div>

    <div id="content">
      <p class="loading">Loading archive…</p>
    </div>
  </main>

  <footer id="footer-stats"></footer>

<script src="app.js"></script>
</body>
</html>
